  <text class="work" x="468" y="310">#8 Batching + bisection</text>
  <text class="work" x="482" y="328">(Najafi, Beheshtian, Fallahzadeh)</text>
  <text class="work" x="468" y="350">#7 Google TAP milestones</text>
  <text class="work" x="468" y="372">#9 Meta full runs on master</text>
