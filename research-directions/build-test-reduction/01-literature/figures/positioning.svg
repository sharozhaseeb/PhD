  <!-- ours band -->
  <rect class="ours" x="215" y="452" width="750" height="116" rx="8"/>
  <text class="ourst" x="590" y="478" text-anchor="middle">Study 1 (measured, then policy): per-edit reduced build + tests + benchmarks,</text>
  <text class="ourst" x="590" y="498" text-anchor="middle">full check when accumulated change crosses a threshold (candidate rule C5; cap of k edits)</text>
  <text class="work" x="590" y="522" text-anchor="middle">Measures (claims): native-extension boundary (C5) · stale dependency/profile data (C7)</text>
  <text class="work" x="590" y="542" text-anchor="middle">dropped-benchmark miss rate (C11) · incremental-rebuild correctness (C8)</text>
  <text class="note" x="590" y="560" text-anchor="middle">Python code with C/Cython extensions; performance-motivated edit sequences</text>
  <text class="note" x="205" y="604">Numbers refer to rows of closest-works.md. Placement is our judgement from the cited sources.</text>
  <text class="note" x="205" y="622">Outside the grid: delta debugging and flake-aware culprit finding (out of Study 1 scope).</text>
</svg>
